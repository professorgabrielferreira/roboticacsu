<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Robótica | Colégio Santa Úrsula</title>
  <meta name="description" content="Recursos educacionais de Robótica do Colégio Santa Úrsula.">
  <link rel="icon" href="simbolo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilo.css">
</head>
<body>

  <a class="pular" href="#recursos">Ir para os recursos</a>

  <header class="topo">
    <div class="topo__conteudo">
      <a class="marca" href="./" aria-label="Página inicial">
        <img src="simbolo.svg" alt="" width="40" height="40">
        <span class="marca__texto">Robótica</span>
      </a>
      <nav class="menu" aria-label="Principal">
        <a href="#recursos">Recursos</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="abertura">
      <svg class="abertura__circuito" viewBox="0 0 520 320" aria-hidden="true">
        <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="3">
          <path class="trilha" d="M20 60h140l40 40h120l30-30h150"/>
          <path class="trilha" d="M60 160h80l30 30h90l40-40h200"/>
          <path class="trilha" d="M20 260h180l30-30h110l40 40h120"/>
          <path class="trilha trilha--viva" d="M200 100v50M330 150v80"/>
        </g>
        <g>
          <circle class="no" cx="20" cy="60" r="7"/><circle class="no" cx="320" cy="100" r="7"/>
          <circle class="no" cx="60" cy="160" r="7"/><circle class="no no--ciano" cx="260" cy="190" r="7"/>
          <circle class="no" cx="20" cy="260" r="7"/><circle class="no no--ciano" cx="340" cy="230" r="7"/>
          <circle class="no no--amarelo" cx="500" cy="70" r="9"/>
          <circle class="no no--amarelo" cx="500" cy="150" r="9"/>
          <circle class="no no--amarelo" cx="500" cy="270" r="9"/>
        </g>
      </svg>

      <div class="abertura__texto">
        <h1>Robótica</h1>
        <p>Colégio Santa Úrsula</p>

        <label class="busca" for="busca">
          <span class="visualmente-oculto">Buscar recursos</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="busca" type="search" placeholder="Busque por tema: Arduino, Scratch, sensores, criptografia..." autocomplete="off">
        </label>
      </div>
    </section>

    <section id="recursos" class="recursos" aria-labelledby="titulo-recursos">
      <div class="recursos__cabecalho">
        <h2 id="titulo-recursos">Escolha a sua turma</h2>
        <button type="button" class="ver-todas" id="ver-todas" hidden>Ver todas as turmas</button>
      </div>

      <div class="trilhas" id="filtro-turma"></div>

      <p class="contagem" id="contagem" aria-live="polite"></p>

      <div class="grade" id="grade"></div>

      <div class="vazio" id="vazio" hidden></div>
    </section>
  </main>

  <footer class="rodape">
    <img src="simbolo.svg" alt="" width="28" height="28">
    <p>Robótica. Colégio Santa Úrsula. <a class="rodape__equipe" href="admin.html">Área da equipe</a></p>
  </footer>

  <script src="recursos.js"></script>
  <script src="app.js"></script>
</body>
</html>
